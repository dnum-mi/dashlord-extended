name: DashLord report

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["DashLord scans"]
    branches: [main]
    types:
      - completed

# allow only one concurrent report action
concurrency:
  cancel-in-progress: true
  group: report

jobs:
  website:
    runs-on: ubuntu-latest
    name: Website

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}

      - id: dashlord-report
        uses: SocialGouv/dashlord-actions/report@v1
        with:
          base-path: /dashlord

      - name: Create website ZIP artifact
        run: |
          cd build
          zip -r ../dashlord-site.zip .

      - name: Upload website ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashlord-site
          path: dashlord-site.zip
          if-no-files-found: error
          retention-days: 30

      - uses: EndBug/add-and-commit@v7
        with:
          add: '["report.json"]'
          default_author: github_actions
          message: "chore: report update"
